name: NLU eval (staging agent)

# Manual gate for changes to the Dialogflow agent in dialogflow/agent/.
# Runs the golden set in evals/ against a STAGING copy of the agent (never
# production) and compares it with the committed baseline.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   secret   GCP_EVAL_SA_KEY   service-account key JSON for the staging project.
#                              "Dialogflow API Client" is enough to run the eval;
#                              "Dialogflow API Admin" is needed for restore_agent.
#   variable GCP_EVAL_PROJECT  the staging GCP project id.
# A long-lived key in a secret is the simple setup. Workload Identity Federation
# (google-github-actions/auth with `id-token: write`) avoids the key entirely and
# is the better choice for anything beyond a demo; see the README roadmap.
# A full run is about 243 detect_intent calls (~2.5 minutes).

on:
  workflow_dispatch:
    inputs:
      restore_agent:
        description: "Restore dialogflow/agent/ into the staging project first (replaces its whole agent)"
        type: boolean
        default: false
      max_drop:
        description: "Largest allowed drop in intent accuracy / conversation pass rate vs the baseline"
        type: string
        default: "0.02"

permissions:
  contents: read

concurrency:
  group: nlu-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Golden-set eval
    runs-on: ubuntu-latest
    env:
      GCP_EVAL_PROJECT: ${{ vars.GCP_EVAL_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check configuration
        env:
          HAS_KEY: ${{ secrets.GCP_EVAL_SA_KEY != '' }}
        run: |
          if [ -z "$GCP_EVAL_PROJECT" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set the GCP_EVAL_SA_KEY secret and the GCP_EVAL_PROJECT variable."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore the agent into staging
        if: ${{ inputs.restore_agent }}
        env:
          GCP_EVAL_SA_KEY: ${{ secrets.GCP_EVAL_SA_KEY }}
        run: |
          key_file="$RUNNER_TEMP/eval-key.json"
          printf '%s' "$GCP_EVAL_SA_KEY" > "$key_file"
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" uv run python scripts/dialogflow_agent.py \
            restore --project "$GCP_EVAL_PROJECT" --confirm "$GCP_EVAL_PROJECT"
          rm -f "$key_file"
          # Dialogflow ES trains after a restore; give it time before scoring.
          sleep 90

      - name: Run the eval and compare with the baseline
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_EVAL_SA_KEY }}
          MAX_DROP: ${{ inputs.max_drop }}
        run: |
          uv run python evals/run_nlu.py --project "$GCP_EVAL_PROJECT" \
            --baseline evals/reports/prod-after-fixes-2026-11-17/results.json \
            --max-drop "$MAX_DROP" --min-accuracy 0.95 \
            --out "evals/reports/ci-${GITHUB_RUN_ID}"

      - name: Job summary
        if: always()
        run: |
          report="evals/reports/ci-${GITHUB_RUN_ID}/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nlu-eval-${{ github.run_id }}
          path: evals/reports/ci-${{ github.run_id }}/
          if-no-files-found: ignore
