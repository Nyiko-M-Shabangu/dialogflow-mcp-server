# Golden set: single-turn NLU cases for the Dialogflow ES food-ordering agent.
#
# Labels say what a GOOD product should do, not what the agent does today.
#
# Fields per case
#   id                 unique, stable (used to diff runs)
#   text               the user utterance that is scored
#   expected_intent    Dialogflow intent display name
#   expected_food_Item list of exact menu names, order-insensitive.
#                      [] = the agent must NOT extract any food_Item.
#                      omitted = not checked.
#   expected_number    order.add: list of quantities in utterance order, aligned
#                      with the food items ("a"/"an" = 1).
#                      track.order*: the order id as an integer.
#                      omitted/null = not checked.
#   allow_slot_prompt  true when a required slot is legitimately missing, so
#                      the agent may answer with a slot prompt
#                      (all_required_params_present = false) instead of filling it.
#   input_contexts     contexts injected through QueryParameters before the
#                      scored request (one API call, no setup turn).
#   context            prior utterances sent first in the same session (one API
#                      call each). Used on a few cases to check that a real
#                      "new order" turn behaves like the injected context.
#   verbatim_in_training
#                      true when the normalised text is also a training phrase of
#                      the agent (see evals/leakage.py). The report gives every
#                      headline metric with and without these cases.
#   tags               slang, typo, multi-item, a/an-quantity, off-menu,
#                      paraphrase, numbers-as-words, track-id, chit-chat,
#                      missing-quantity, synonym, exact-phrase, no-context
#
# Menu (exact food_Item values): Bunny Chow, Boerewors Roll, Pap & Chakalaka,
# Bobotie, Vetkoek, Kota, Malva Pudding, Milk Tart, Sosaties.

